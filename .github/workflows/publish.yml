name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Extract the version from the tag (e.g. v1.2.3 -> 1.2.3), write it into
      # package.json, then publish. This avoids manually bumping the version
      # and keeps the tag as the single source of truth.
      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      # Publish via OIDC trusted publishing. No NPM_TOKEN secret needed;
      # npm CLI exchanges the GitHub OIDC token automatically.
      - name: Publish to npm
        run: npm publish

      # Create a GitHub release with the same tag so installs, links, and
      # release notes are discoverable from the repo page.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
