name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: write # Required to create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing (OIDC) requires npm >= 11.5.1. Node 24 ships
          # npm 11+; Node 22 still bundles npm 10, which cannot use OIDC.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Version comes from package.json. Release flow: run `npm version
      # <new-version>` locally (bumps package.json AND creates the matching
      # git tag), then push both. The workflow only publishes.
      #
      # Publish via OIDC trusted publishing. No NPM_TOKEN secret needed;
      # npm CLI exchanges the GitHub OIDC token automatically.
      - name: Publish to npm
        run: npm publish

      # Create a GitHub release with the same tag so installs, links, and
      # release notes are discoverable from the repo page.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
